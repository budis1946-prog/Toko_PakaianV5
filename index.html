<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Toko Baju</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="header">

    <div class="container header-inner">

        <div class="logo">
            TOKO BAJU
        </div>

        <div class="header-info">
            Koleksi Terbaru
        </div>

    </div>

</header>


<main>

    <!-- HERO -->
    <section class="hero">

        <div class="container">

            <h1>Koleksi Baju</h1>

            <p>
                Temukan produk pilihan kami dengan harga terbaik.
            </p>

        </div>

    </section>


    <!-- FILTER -->
    <section class="filter-section">

        <div class="container filter-wrapper">

            <div class="search-box">

                <input
                    type="text"
                    id="searchInput"
                    placeholder="Cari nama atau deskripsi produk..."
                >

            </div>


            <div class="status-filter">

                <button
                    class="filter-btn active"
                    data-status="ALL"
                >
                    Semua
                </button>

                <button
                    class="filter-btn"
                    data-status="READY"
                >
                    Ready
                </button>

                <button
                    class="filter-btn"
                    data-status="SOLD"
                >
                    Sold
                </button>

            </div>

        </div>

    </section>


    <!-- LOADING -->
    <section id="loading">

        <div class="container">

            <div class="loading-box">
                Memuat produk...
            </div>

        </div>

    </section>


    <!-- PRODUCT -->
    <section class="products-section">

        <div class="container">

            <div
                id="productGrid"
                class="product-grid"
            ></div>


            <div
                id="emptyState"
                class="empty-state"
                style="display:none;"
            >

                <h3>Produk tidak ditemukan</h3>

                <p>
                    Coba gunakan kata pencarian lain.
                </p>

            </div>

        </div>

    </section>

</main>


<footer>

    <div class="container">

        © 2026 Toko Baju

    </div>

</footer>


<script src="js/catalog.js"></script>

</body>
</html>
